services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zkredit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zkredit_dev_password}
      POSTGRES_DB: zkredit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkredit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local test blockchain (Foundry Anvil). Fresh chain on every `docker compose up`.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot job: deploys Halo2Verifier + LoanApplicationRegistry, then exits.
  contracts-deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts:ro
    environment:
      - RPC_URL=http://anvil:8545
      # Anvil's PUBLIC test key (account #0). Never use on a real network.
      - DEPLOYER_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - REGISTRY_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Work on a copy: the Windows-mounted folder is read-only for forge's cache/out files
        rm -rf /tmp/work && mkdir -p /tmp/work
        cp -r /contracts/. /tmp/work/
        cd /tmp/work
        rm -rf cache out broadcast
        if [ ! -d lib/forge-std ]; then
          echo "forge-std missing, installing..."
          forge install foundry-rs/forge-std --no-git
        fi
        if [ "$$(cast code $$REGISTRY_ADDRESS --rpc-url $$RPC_URL)" != "0x" ]; then
          echo "Contracts already deployed, skipping."
          exit 0
        fi
        forge script script/Deploy.s.sol --rpc-url $$RPC_URL --private-key $$DEPLOYER_KEY --broadcast
        if [ "$$(cast code $$REGISTRY_ADDRESS --rpc-url $$RPC_URL)" = "0x" ]; then
          echo "ERROR: registry is not at the expected address"
          exit 1
        fi
        echo "Deployed. Registry at $$REGISTRY_ADDRESS"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Circuit artifacts (settings.json, model.compiled, vk.key, and your
      # locally-generated pk.key) — mounted read-only so proof generation
      # works without baking the (large, model-specific) pk.key into the image.
      - ./circuits:/app/circuits:ro
      # Persists the KZG SRS cache across container restarts, so you don't
      # re-download it (~few hundred MB) every time.
      - ezkl_srs_cache:/root/.ezkl
    environment:
      - CIRCUIT_DIR=/app/circuits/loan_model
      - DATABASE_URL=postgresql://zkredit:${POSTGRES_PASSWORD:-zkredit_dev_password}@db:5432/zkredit
      # CHANGE THIS in any real deployment — this default is dev-only.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      # Get this from https://console.cloud.google.com/apis/credentials
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # On-chain verification (Anvil runs as the `anvil` service above)
      - ONCHAIN_ENABLED=true
      - RPC_URL=http://anvil:8545
      - REGISTRY_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - ONCHAIN_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    depends_on:
      db:
        condition: service_healthy
      contracts-deployer:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ezkl_srs_cache: