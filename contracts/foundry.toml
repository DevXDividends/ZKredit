[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# solc version note: this sandbox couldn't reach binaries.soliditylang.org, so we had to
# manually pin a local solc binary during development. On a normal machine with internet
# access, Foundry will auto-download the right solc version — no `solc = "..."` line needed.
# If you hit the same blocker, see contracts/README.md for a workaround.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
