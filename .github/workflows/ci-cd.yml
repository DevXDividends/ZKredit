name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # CI: these three run on every push and every PR. Deploy jobs (below)
  # only run on a push to main, and only after their corresponding test
  # job passes.
  # ---------------------------------------------------------------------

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          JWT_SECRET_KEY: ci-test-secret-not-for-production
        run: python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: https://placeholder.invalid
          VITE_GOOGLE_CLIENT_ID: ""
        run: npm run build

  contracts-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Run Foundry tests
        run: forge test -vv

  deploy-backend:
    needs: [backend-tests, contracts-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zkredit-repo/zkredit-backend -f backend/Dockerfile .

      - name: Push image
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zkredit-repo/zkredit-backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy zkredit-backend \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zkredit-repo/zkredit-backend \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --set-env-vars "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},DATABASE_URL=${{ secrets.DATABASE_URL }},ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }},CIRCUIT_DIR=/app/circuits/loan_model,PK_KEY_URL=${{ secrets.PK_KEY_URL }},GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"

  # ---------------------------------------------------------------------
  # CD: deploy hooks. Only fire on a push to main, and only after the
  # relevant tests pass.
  # ---------------------------------------------------------------------`


